<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Walrus Cup Oracle - World Cup 2026 Predictions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                    colors: {
                        walrus: { dark: "#0b1528", card: "#162238", aqua: "#00f2fe", lightAqua: "#4facfe" },
                        worldcup: { gold: "#f59e0b", grass: "#10b981" }
                    },
                    animation: { 'border-glow': 'borderGlow 4s linear infinite' },
                    keyframes: {
                        borderGlow: { '0%, 100%': { 'border-color': 'rgba(245, 158, 11, 0.4)' }, '50%': { 'border-color': 'rgba(0, 242, 254, 1)' } }
                    }
                }
            }
        }
    </script>
    <style>
        .gradient-text { background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .gradient-btn { background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%); }
        .hero-bg { background: linear-gradient(to bottom, rgba(11, 21, 40, 0.85), rgba(11, 21, 40, 1)), url('wc1.png'); background-size: cover; background-position: center; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #0b1528; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #162238; border: 1px solid rgba(0, 242, 254, 0.2); border-radius: 10px; }
        .hot-match-card { animation: border-glow 4s linear infinite; border-width: 2px !important; }
    </style>
</head>
<body class="bg-walrus-dark text-gray-100 min-h-screen font-sans antialiased relative overflow-x-hidden">

    <canvas id="effect-canvas" class="absolute top-0 left-0 w-full h-full pointer-events-none z-50"></canvas>

    <header class="border-b border-gray-800 bg-walrus-dark/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl gradient-btn flex items-center justify-center text-walrus-dark shadow-lg shadow-walrus-aqua/20">
                    <i class="fa-solid fa-trophy text-xl"></i>
                </div>
                <div>
                    <span class="text-xl font-extrabold tracking-tight text-white flex items-center gap-2">WALRUS<span class="gradient-text">CUP</span>ORACLE</span>
                    <span class="text-[10px] text-worldcup-gold block font-semibold tracking-wider uppercase">World Cup 2026 Edition</span>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <button onclick="toggleLanguage()" id="langBtn" class="flex items-center gap-2 px-3 py-2 bg-gray-800 hover:bg-gray-700 text-gray-200 text-xs font-bold rounded-xl border border-gray-700 transition">
                    <img id="langFlag" src="https://flagcdn.com/w20/gb.png" class="w-5 h-3.5 object-cover rounded-sm" alt="English">
                    <span id="langText">EN</span>
                </button>
                <button id="gmailBtn" onclick="toggleGmail()" class="flex items-center gap-2 px-4 py-2 bg-gray-800 hover:bg-gray-700 text-gray-200 text-sm font-semibold rounded-xl border border-gray-700 transition">
                    <i class="fa-brands fa-google text-red-500"></i>
                    <span id="gmailText">Đăng nhập Gmail</span>
                </button>
                <button onclick="fetchMyPredictions()" class="bg-gray-800 text-walrus-aqua px-4 py-2.5 rounded-xl border border-walrus-aqua/30 text-sm font-bold transition hover:bg-walrus-aqua hover:text-walrus-dark">
                    <i class="fa-solid fa-clock-rotate-left"></i> <span id="btn-history-text">Lịch sử dự đoán</span>
                </button> 
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-12 space-y-16">
        <section id="groups-container" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4"></section>
        <div id="match-list-container" class="space-y-6"></div>
        <div id="leaderboard-container" class="bg-walrus-card border border-gray-800 rounded-2xl p-4 space-y-3 shadow-xl"></div>
    </main>

    <footer class="border-t border-gray-800 bg-gray-950 py-8 text-center text-xs text-gray-500">
        <p>&copy; 2026 Walrus Cup Oracle. Powered by Walrus Memory Layer.</p>
    </footer>

    <script src="data.js"></script>
    <script src="ui-components.js"></script>
    <script type="module" src="app-logic.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Hàm initApp được định nghĩa trong app-logic.js
            if (typeof initApp === 'function') {
                initApp();
            }
        });
    </script>
</body>
</html>
